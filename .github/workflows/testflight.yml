name: TestFlight Deploy

# Every push to main builds & archives (fast "does it compile" feedback).
# The archive is only exported and UPLOADED to TestFlight when you either:
#   - run this workflow manually from the Actions tab (workflow_dispatch), or
#   - put the token [deploy] in the commit's SUBJECT line (first line only —
#     mentions in the body are ignored, so "no [deploy] here" won't trigger).
# This keeps routine commits from burning App Store Connect's per-app daily
# upload limit (error 90382). No Mac required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only build the newest commit; if you push several times in a row the
# earlier runs are cancelled instead of stacking up.
concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, Archive & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      SCHEME: Docked
      PROJECT: Docked.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/Docked.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Decide whether to upload
        id: gate
        # Upload only for a manual run, or when the commit's SUBJECT LINE
        # (not the body) contains the literal token [deploy]. Checking just the
        # subject avoids false positives from prose like "no [deploy] here".
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s | grep -qF '[deploy]'; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Decision: upload=$(tail -n1 "$GITHUB_OUTPUT")"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin to the major Xcode whose SDK App Store Connect currently requires.
          # Bump this as Apple's minimum-SDK requirement moves forward.
          xcode-version: "26"

      - name: Preflight — all 8 secrets present
        env:
          DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          missing=0
          for name in DISTRIBUTION_CERTIFICATE_P12_BASE64 DISTRIBUTION_CERTIFICATE_PASSWORD \
                      PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID KEYCHAIN_PASSWORD \
                      APP_STORE_CONNECT_API_KEY_P8 APPLE_KEY_ID APPLE_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret '$name' is empty or not set on acetwothree/docked."
              missing=1
            else
              echo "ok: $name"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::GitHub secrets are per-repository. Add every secret above under"
            echo "::error::Settings > Secrets and variables > Actions on THIS repo (same values as stepmates)."
            exit 1
          fi

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the base64 binary secrets back into real files. Strip any
          # whitespace/newlines a copy-paste may have introduced.
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode -o "$PP_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded distribution .p12 is empty — DISTRIBUTION_CERTIFICATE_P12_BASE64 is missing or not valid base64."
            exit 1
          fi
          if ! security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist" 2>/dev/null; then
            echo "::error::Provisioning profile did not decode — re-encode 'Docked AppStore.mobileprovision' as one unbroken base64 line into PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

          # Job-scoped keychain so codesign finds the cert without touching the
          # runner's default keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::.p12 import failed — DISTRIBUTION_CERTIFICATE_PASSWORD likely doesn't match the .p12."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # Install the profile where Xcode looks for it, named by its UUID
          # (profile.plist was already produced + validated above).
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed -i '' "s/__APPLE_TEAM_ID__/$APPLE_TEAM_ID/g" ExportOptions.plist
          sed -i '' "s/__PROVISIONING_PROFILE_UUID__/$PROFILE_UUID/g" ExportOptions.plist

      - name: Build & archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Docked.xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Skipping TestFlight upload
        if: steps.gate.outputs.upload != 'true'
        run: |
          echo "::notice::Built & archived only. To upload to TestFlight, re-run"
          echo "::notice::this workflow from the Actions tab, or push a commit whose"
          echo "::notice::message contains [deploy]."

      - name: Write App Store Connect API key
        if: steps.gate.outputs.upload == 'true'
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          cat <<EOF > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
          $APP_STORE_CONNECT_API_KEY_P8
          EOF

      - name: Export & upload to TestFlight
        if: steps.gate.outputs.upload == 'true'
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"

      - name: Clean up keychain & API key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
